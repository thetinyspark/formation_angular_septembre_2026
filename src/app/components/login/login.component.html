@if( isLoggedIn() ){
    <button (click)="logout()">Logout</button>
}
@else{
    <form [formGroup]="form" (ngSubmit)="login()">
        <div>
            <label>Email:</label>
            <input type="email" formControlName="email"/>
            @if( form.get("email")?.errors){
                <p>Le champ n'est pas valide</p>
            }
        </div>
        <div>
            <label>Password:</label>
            <input type="password" formControlName="password"/>
            @if( form.get("password")?.errors?.['tooShortPassword']){
                <p>Le mot de passe requiert au minimum 8 caractères</p>
            }
        </div>

        @if( form.valid){
            <button type="submit">Connexion</button>
        }
        @else{
            <button type="submit" disabled="disabled">Connexion</button>
        }
    </form>
}
